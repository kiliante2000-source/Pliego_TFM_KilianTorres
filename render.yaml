# Free deploy on Render — https://dashboard.render.com
# Native Node (more reliable than Docker on free tier).
# Does NOT use github.io (portfolio stays untouched).
# mobile-responsive: 2026-09-28

services:
  - type: web
    name: pliego
    runtime: node
    plan: free
    region: oregon
    # --include=dev: Render injects NODE_ENV=production which would skip vite/tsc
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: pliego_token
      - key: CORS_ORIGIN
        value: "https://pliego-kr1j.onrender.com,https://kiliante2000-source.github.io,http://127.0.0.1:4174,http://127.0.0.1:45321"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      # Chromium: resolved at runtime via @sparticuz/chromium on native Node
      # (Docker image still uses system /usr/bin/chromium when CHROME_PATH is set)
