# Free deploy on Render — https://dashboard.render.com
# Native Node (more reliable than Docker on free tier).
# Does NOT use github.io (portfolio stays untouched).

services:
  - type: web
    name: pliego
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:web && npm run db:generate --workspace=backend
    startCommand: npm run start:web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./data/pliego.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: pliego_token
      - key: UPLOAD_DIR
        value: ./uploads
      - key: EXPORT_DIR
        value: ./exports
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: PUBLIC_DIR
        value: ./backend/public
      - key: CHROME_PATH
        value: /usr/bin/chromium
