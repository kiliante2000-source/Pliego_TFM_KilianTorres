# Free deploy on Render — https://dashboard.render.com
# Native Node (more reliable than Docker on free tier).
# Does NOT use github.io (portfolio stays untouched).

services:
  - type: web
    name: pliego
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: pliego_token
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      # Paths are normalized to absolute in scripts/start-web.mjs
      - key: CHROME_PATH
        value: /usr/bin/chromium
